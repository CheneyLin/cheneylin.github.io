<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#000000">
	<title>macOS 升级</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
			background: #000;
			color: #f5f5f7;
		}

		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
		}

		body {
			display: grid;
			min-height: 100dvh;
			place-items: center;
		}

		.upgrade-screen {
			display: flex;
			width: min(100%, 620px);
			min-height: 100dvh;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 24px;
			transform: translateY(-1.5vh);
		}

		.apple-logo {
			margin: 0 0 clamp(72px, 10.2vh, 104px);
			color: #f5f5f7;
			font-family: -apple-system, BlinkMacSystemFont, sans-serif;
			font-size: clamp(76px, 9vw, 96px);
			font-weight: 400;
			line-height: .72;
			letter-spacing: -8px;
			text-indent: -7px;
			user-select: none;
		}

		.progress-wrap {
			width: min(234px, 64vw);
		}

		.progress-track {
			width: 100%;
			height: 6px;
			overflow: hidden;
			border-radius: 999px;
			background: #333336;
			box-shadow: inset 0 1px 1px rgb(255 255 255 / 12%);
		}

		.progress-bar {
			width: 25%;
			height: 100%;
			border-radius: inherit;
			background: #d9d9dc;
			transition: width 1s linear;
		}

		.status {
			margin: 18px 0 0;
			color: #9b9b9f;
			font-size: 11px;
			font-weight: 400;
			letter-spacing: 0;
			line-height: 1.4;
			text-align: center;
			white-space: nowrap;
		}

		@media (max-width: 420px) {
			.upgrade-screen { transform: translateY(-2vh); }
			.apple-logo { margin-bottom: 72px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.progress-bar { transition: none; }
		}
	</style>
</head>
<body>
	<main class="upgrade-screen" aria-label="macOS 正在升级">
		<div class="apple-logo" aria-hidden="true"></div>
		<section class="progress-wrap" aria-live="polite">
			<div class="progress-track" role="progressbar" aria-label="系统升级进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25">
				<div class="progress-bar"></div>
			</div>
			<p class="status">还剩大约 12 分钟...</p>
		</section>
	</main>

	<script>
		(() => {
			const bar = document.querySelector('.progress-bar');
			const track = document.querySelector('.progress-track');
			const status = document.querySelector('.status');
			let progress = 25;

			const update = () => {
				progress = Math.min(progress + 0.08, 99);
				const remaining = Math.max(1, Math.ceil((100 - progress) / 6.2));
				bar.style.width = `${progress}%`;
				track.setAttribute('aria-valuenow', Math.round(progress));
				status.textContent = progress > 95
					? '即将完成...'
					: `还剩大约 ${remaining} 分钟...`;
			};

			window.setInterval(update, 1000);
		})();
	</script>
</body>
</html>
